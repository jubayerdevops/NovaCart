<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Internet -->
  <rect x="380" y="12" width="140" height="36" rx="18" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="450" y="35" text-anchor="middle" fill="#312e81" font-weight="bold">Internet</text>
  <line x1="450" y1="48" x2="450" y2="78" stroke="#4f46e5" stroke-width="2"/>

  <!-- VPC -->
  <rect x="20" y="80" width="860" height="500" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="36" y="102" fill="#0f172a" font-weight="bold">VPC 10.0.0.0/16 · ap-southeast-1</text>
  <rect x="390" y="86" width="120" height="26" rx="4" fill="#4f46e5"/>
  <text x="450" y="104" text-anchor="middle" fill="#fff">Internet Gateway</text>

  <!-- AZ columns -->
  <rect x="40" y="122" width="400" height="440" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="56" y="142" fill="#475569" font-weight="bold">AZ a (ap-southeast-1a)</text>
  <rect x="460" y="122" width="400" height="440" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="476" y="142" fill="#475569" font-weight="bold">AZ b (ap-southeast-1b)</text>

  <!-- Public subnets -->
  <g>
    <rect x="56" y="154" width="368" height="110" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="68" y="174" fill="#14532d" font-weight="bold">Public 10.0.0.0/24</text>
    <rect x="476" y="154" width="368" height="110" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="488" y="174" fill="#14532d" font-weight="bold">Public 10.0.1.0/24</text>
    <rect x="80" y="190" width="120" height="30" rx="4" fill="#fff" stroke="#16a34a"/>
    <text x="140" y="210" text-anchor="middle">NAT GW + EIP</text>
    <rect x="500" y="190" width="120" height="30" rx="4" fill="#fff" stroke="#16a34a" stroke-dasharray="4 3"/>
    <text x="560" y="210" text-anchor="middle">NAT GW (prod)</text>
    <rect x="300" y="190" width="300" height="30" rx="4" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="450" y="210" text-anchor="middle">ALB (spans both public subnets) — M04</text>
    <text x="68" y="250" fill="#166534" font-size="12">rt: 0.0.0.0/0 → IGW</text>
    <text x="488" y="250" fill="#166534" font-size="12">rt: 0.0.0.0/0 → IGW</text>
  </g>

  <!-- Private subnets -->
  <g>
    <rect x="56" y="282" width="368" height="120" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="68" y="302" fill="#1e3a8a" font-weight="bold">Private (app) 10.0.10.0/24</text>
    <rect x="476" y="282" width="368" height="120" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="488" y="302" fill="#1e3a8a" font-weight="bold">Private (app) 10.0.11.0/24</text>
    <rect x="80" y="318" width="140" height="30" rx="4" fill="#fff" stroke="#2563eb"/>
    <text x="150" y="338" text-anchor="middle">nginx (ASG) — M04</text>
    <rect x="500" y="318" width="140" height="30" rx="4" fill="#fff" stroke="#2563eb"/>
    <text x="570" y="338" text-anchor="middle">nginx (ASG) — M04</text>
    <text x="68" y="388" fill="#1e40af" font-size="12">rt: 0.0.0.0/0 → NAT a</text>
    <text x="488" y="388" fill="#1e40af" font-size="12">rt: 0.0.0.0/0 → NAT a (dev) / NAT b (prod)</text>
  </g>

  <!-- Database subnets -->
  <g>
    <rect x="56" y="420" width="368" height="120" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="68" y="440" fill="#7f1d1d" font-weight="bold">Database 10.0.20.0/24</text>
    <rect x="476" y="420" width="368" height="120" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="488" y="440" fill="#7f1d1d" font-weight="bold">Database 10.0.21.0/24</text>
    <rect x="80" y="456" width="140" height="30" rx="4" fill="#fff" stroke="#dc2626"/>
    <text x="150" y="476" text-anchor="middle">RDS primary — M05</text>
    <rect x="500" y="456" width="140" height="30" rx="4" fill="#fff" stroke="#dc2626" stroke-dasharray="4 3"/>
    <text x="570" y="476" text-anchor="middle">RDS standby (prod)</text>
    <text x="68" y="526" fill="#991b1b" font-size="12">rt: local only — no default route</text>
    <text x="488" y="526" fill="#991b1b" font-size="12">rt: local only — no default route</text>
  </g>

  <!-- arrows: private -> NAT -->
  <line x1="150" y1="318" x2="140" y2="222" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs>
</svg>
